<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Qui Tam Case Engine{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <style>
        .severity-CRITICAL { color: #dc2626; font-weight: 700; }
        .severity-HIGH { color: #ea580c; font-weight: 600; }
        .severity-MEDIUM { color: #ca8a04; }
        .severity-LOW { color: #65a30d; }
        .type-RULE_VIOLATION { background: #fef2f2; border-left: 4px solid #dc2626; }
        .type-STATISTICAL { background: #fffbeb; border-left: 4px solid #ca8a04; }
        .risk-LOW { color: #16a34a; }
        .risk-MEDIUM { color: #ca8a04; }
        .risk-HIGH { color: #dc2626; }
        .score-bar { transition: width 0.5s ease; }
    </style>
</head>
<body class="bg-gray-50 text-gray-900 font-mono">
    <nav class="bg-gray-900 text-white px-6 py-3">
        <div class="max-w-7xl mx-auto flex items-center justify-between">
            <a href="/" class="text-lg font-bold tracking-tight">QUI TAM CASE ENGINE</a>
            <div class="text-sm text-gray-400">False Claims Act &mdash; Healthcare, Government Contracts &amp; Financial Fraud</div>
        </div>
    </nav>
    <main class="max-w-7xl mx-auto px-4 py-6">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
