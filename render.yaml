services:
  - type: web
    name: qui-tam-case-engine
    runtime: python
    rootDir: qui-tam-engine
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: SAM_API_KEY
        sync: false
      - key: FEC_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: COURTLISTENER_API_KEY
        sync: false
      - key: GSA_API_KEY
        sync: false
